name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Build and inspect release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          canaries = (
              "%SystemDrive%/cache/release-canary.txt",
              "benchmark_output/release-canary.csv",
              "local-review.patch",
              "untracked-local-note.txt",
              ".vscode/release-canary.json",
              ".idea/release-canary.xml",
              ".pytest_cache/release-canary.txt",
              ".uv-cache/release-canary.txt",
              "build/release-canary.txt",
              "dist/release-canary.txt",
              "src/tallydiff/review.patch",
              "src/tallydiff/untracked-local-note.txt",
              "src/tallydiff/untracked_helper.py",
              ".codex/release-canary.txt",
              ".agents/release-canary.txt",
              "venv/release-canary.txt",
              "src/tallydiff/__pycache__/release-canary.pyc",
          )
          for name in canaries:
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text("Release exclusion canary\n", encoding="utf-8")
          PY
          uv build
          uv run python -m scripts.check_release_artifacts
