name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Build and inspect release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          canaries = (
              "%SystemDrive%/cache/release-canary.txt",
              "benchmark_output/release-canary.csv",
              "benchmark_output/review_v07.json",
              "local-review.patch",
              "untracked-local-note.txt",
              ".vscode/release-canary.json",
              ".idea/release-canary.xml",
              ".pytest_cache/release-canary.txt",
              ".uv-cache/release-canary.txt",
              "build/release-canary.txt",
              "dist/release-canary.txt",
              "src/tallydiff/review.patch",
              "src/tallydiff/untracked-local-note.txt",
              "src/tallydiff/untracked_helper.py",
              ".codex/release-canary.txt",
              ".agents/release-canary.txt",
              "venv/release-canary.txt",
              "src/tallydiff/__pycache__/release-canary.pyc",
          )
          for name in canaries:
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text("Release exclusion canary\n", encoding="utf-8")
          PY
          uv build
          uv run python -m scripts.check_release_artifacts
      - name: Smoke the exact installed wheel outside checkout
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/tallydiff-wheel-smoke.XXXXXX")"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$smoke_dir/runtime-requirements.txt"
          uv venv --python "${{ matrix.python-version }}" "$smoke_dir/venv"
          smoke_python="$smoke_dir/venv/bin/python"
          uv pip sync --python "$smoke_python" --require-hashes "$smoke_dir/runtime-requirements.txt"
          wheel="$GITHUB_WORKSPACE/dist/tallydiff-0.7.0-py3-none-any.whl"
          "$smoke_python" -I - "$wheel" "$smoke_dir/wheel-requirements.txt" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          wheel = Path(sys.argv[1]).resolve(strict=True)
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          Path(sys.argv[2]).write_text(
              f"tallydiff @ {wheel.as_uri()} --hash=sha256:{digest}\n", encoding="utf-8"
          )
          PY
          uv pip install --python "$smoke_python" --require-hashes --no-deps --requirements "$smoke_dir/wheel-requirements.txt"
          uv pip check --python "$smoke_python"
          cp scripts/review_smoke.py "$smoke_dir/review_smoke.py"
          cd "$smoke_dir"
          "$smoke_python" -I review_smoke.py --wheel "$wheel" --checkout-root "$GITHUB_WORKSPACE"
