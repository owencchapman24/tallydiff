[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tallydiff"
version = "0.1.0"
description = "Traceable reconciliation for structured financial exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
