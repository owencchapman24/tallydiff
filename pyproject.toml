[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tallydiff"
version = "0.5.0"
description = "Traceable reconciliation for structured financial exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "**/%SystemDrive%/**",
    "**/benchmark_output/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/.uv-cache/**",
    "**/.venv/**",
    "**/venv/**",
    "**/build/**",
    "**/dist/**",
    "**/.vscode/**",
    "**/.idea/**",
    "**/.codex/**",
    "**/.agents/**",
    "*.py[cod]",
    "*.patch",
    "*.diff",
    "*.orig",
    "*.rej",
]

[tool.hatch.build.targets.wheel]
# Keep runtime selection exact; unknown package-local files must not ship.
only-include = [
    "src/tallydiff/__init__.py",
    "src/tallydiff/_decimal.py",
    "src/tallydiff/amounts.py",
    "src/tallydiff/app.py",
    "src/tallydiff/configuration.py",
    "src/tallydiff/engine.py",
    "src/tallydiff/export.py",
    "src/tallydiff/ingest.py",
    "src/tallydiff/models.py",
    "src/tallydiff/normalization.py",
    "src/tallydiff/normalization_config.py",
    "src/tallydiff/presentation.py",
    "src/tallydiff/profiles.py",
    "src/tallydiff/subset_matching.py",
    "src/tallydiff/xlsx.py",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/tallydiff/__init__.py",
    "/src/tallydiff/_decimal.py",
    "/src/tallydiff/amounts.py",
    "/src/tallydiff/app.py",
    "/src/tallydiff/configuration.py",
    "/src/tallydiff/engine.py",
    "/src/tallydiff/export.py",
    "/src/tallydiff/ingest.py",
    "/src/tallydiff/models.py",
    "/src/tallydiff/normalization.py",
    "/src/tallydiff/normalization_config.py",
    "/src/tallydiff/presentation.py",
    "/src/tallydiff/profiles.py",
    "/src/tallydiff/subset_matching.py",
    "/src/tallydiff/xlsx.py",
    "/tests/*.py",
    "/scripts/*.py",
    "/sample_data/*.csv",
    "/docs/tallydiff-demo.png",
    "/.github/workflows/ci.yml",
    "/.streamlit/config.toml",
    "/.gitignore",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
